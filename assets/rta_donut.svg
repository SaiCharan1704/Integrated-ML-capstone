<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060d1a"/><stop offset="1" stop-color="#0f1d33"/></linearGradient>
<linearGradient id="gg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#12b886"/><stop offset="1" stop-color="#34f089"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

</defs>
<style>text{fill:#e8f1ff} .m{fill:#8fa6c7}</style>
<rect width="1200" height="360" rx="18" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#22385c" stroke-width="1.5"/>
<text x="36" y="40" font-size="22" font-weight="800">Target imbalance: the whole story of this track</text><text x="36" y="64" font-size="14" class="m">12,316 accidents · Accident_severity</text><circle cx="260" cy="215" r="100" fill="none" stroke="#0c1a30" stroke-width="40"/><circle cx="260" cy="215" r="100" fill="none" stroke="#34f089" stroke-width="40" pathLength="100" transform="rotate(-90 260 215)" stroke-dashoffset="0"><animate attributeName="stroke-dasharray" values="0 100;0 100;84.56 15.439999999999998;84.56 15.439999999999998;0 100" keyTimes="0.0000;0.0500;0.3000;0.9300;1.0000" dur="10s" begin="0s" repeatCount="indefinite"/></circle><circle cx="260" cy="215" r="100" fill="none" stroke="#fbbf24" stroke-width="40" pathLength="100" transform="rotate(-90 260 215)" stroke-dashoffset="-84.56"><animate attributeName="stroke-dasharray" values="0 100;0 100;14.15 85.85;14.15 85.85;0 100" keyTimes="0.0000;0.1100;0.3600;0.9300;1.0000" dur="10s" begin="0s" repeatCount="indefinite"/></circle><circle cx="260" cy="215" r="100" fill="none" stroke="#fb7185" stroke-width="40" pathLength="100" transform="rotate(-90 260 215)" stroke-dashoffset="-98.71000000000001"><animate attributeName="stroke-dasharray" values="0 100;0 100;1.28 98.72;1.28 98.72;0 100" keyTimes="0.0000;0.1700;0.4200;0.9300;1.0000" dur="10s" begin="0s" repeatCount="indefinite"/></circle><text x="260" y="211" font-size="34" font-weight="900" text-anchor="middle" fill="#34f089">84.6%</text><text x="260" y="237" font-size="13" text-anchor="middle" class="m">are Slight</text><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1000;0.2000;0.9300;1.0000" dur="10s" begin="0s" repeatCount="indefinite"/><rect x="520" y="130" width="12" height="46" rx="4" fill="#34f089"/><text x="548" y="150" font-size="20" font-weight="800">Slight Injury</text><text x="548" y="172" font-size="15" class="m">10,415 records · 84.56%</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1800;0.2800;0.9300;1.0000" dur="10s" begin="0s" repeatCount="indefinite"/><rect x="520" y="200" width="12" height="46" rx="4" fill="#fbbf24"/><text x="548" y="220" font-size="20" font-weight="800">Serious Injury</text><text x="548" y="242" font-size="15" class="m">1,743 records · 14.15%</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2600;0.3600;0.9300;1.0000" dur="10s" begin="0s" repeatCount="indefinite"/><rect x="520" y="270" width="12" height="46" rx="4" fill="#fb7185"/><text x="548" y="290" font-size="20" font-weight="800">Fatal injury</text><text x="548" y="312" font-size="15" class="m">158 records · 1.28%</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.3500;0.4500;0.9300;1.0000" dur="10s" begin="0s" repeatCount="indefinite"/><rect x="820" y="120" width="340" height="190" rx="14" fill="#101e35" stroke="#fb7185" stroke-opacity=".6"/><text x="840" y="150" font-size="14" font-weight="800" letter-spacing="2" fill="#fb7185">WHY THIS MATTERS</text><text x="840" y="182" font-size="15">A model that always says “Slight”</text><text x="840" y="206" font-size="15">is already ~85% accurate.</text><text x="840" y="230" font-size="15">So accuracy alone is misleading —</text><text x="840" y="254" font-size="15">we track weighted F1, ROC-AUC</text><text x="840" y="278" font-size="15">and per-class recall instead.</text></g>
</svg>