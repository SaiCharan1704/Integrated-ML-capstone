ke-width="3"><animate attributeName="stroke-width" values="3;7;3;3" keyTimes="0;.08;.2;1" dur="6s" begin="2.00s" repeatCount="indefinite"/></circle><text x="500.0" y="112" font-size="20" font-weight="800" text-anchor="middle" fill="#22d3ee">3</text><text x="500.0" y="166" font-size="15" font-weight="700" text-anchor="middle">Engineer</text><text x="500.0" y="188" font-size="12.5" text-anchor="middle" class="m">hour · day · period</text><circle cx="700.0" cy="105" r="30" fill="#101e35" stroke="#22d3ee" stroke-width="3"><animate attributeName="stroke-width" values="3;7;3;3" keyTimes="0;.08;.2;1" dur="6s" begin="3.00s" repeatCount="indefinite"/></circle><text x="700.0" y="112" font-size="20" font-weight="800" text-anchor="middle" fill="#22d3ee">4</text><text x="700.0" y="166" font-size="15" font-weight="700" text-anchor="middle">Preprocess</text><text x="700.0" y="188" font-size="12.5" text-anchor="middle" class="m">impute · scale · OHE</text><circle cx="900.0" cy="105" r="30" fill="#101e35" stroke="#22d3ee" stroke-width="3"><animate attributeName="stroke-width" values="3;7;3;3" keyTimes="0;.08;.2;1" dur="6s" begin="4.00s" repeatCount="indefinite"/></circle><text x="900.0" y="112" font-size="20" font-weight="800" text-anchor="middle" fill="#22d3ee">5</text><text x="900.0" y="166" font-size="15" font-weight="700" text-anchor="middle">Train 10</text><text x="900.0" y="188" font-size="12.5" text-anchor="middle" class="m">linear → ensembles</text><circle cx="1100.0" cy="105" r="30" fill="#101e35" stroke="#22d3ee" stroke-width="3"><animate attributeName="stroke-width" values="3;7;3;3" keyTimes="0;.08;.2;1" dur="6s" begin="5.00s" repeatCount="indefinite"/></circle><text x="1100.0" y="112" font-size="20" font-weight="800" text-anchor="middle" fill="#22d3ee">6</text><text x="1100.0" y="166" font-size="15" font-weight="700" text-anchor="middle">Tune + Test</text><text x="1100.0" y="188" font-size="12.5" text-anchor="middle" class="m">GridSearchCV</text>
