<rect x="1" y="1" width="1198" height="398" rx="17" fill="none" stroke="#22385c" stroke-width="1.5"/>
<text x="36" y="40" font-size="22" font-weight="800">K-Means vs Agglomerative (average linkage)</text><text x="36" y="64" font-size="14" class="m">Same 2,000 observations · k = 5 for both · internal validity metrics</text><text x="36" y="122" font-size="17" font-weight="800">Silhouette Score</text><text x="36" y="144" font-size="13" class="m">higher is better</text><text x="320" y="120" font-size="13" text-anchor="end" class="m">K-Means</text><rect x="330" y="102" width="640" height="24" rx="6" fill="#0c1a30"/><rect x="330" y="102" width="0" height="24" rx="6" fill="#34f089" ><animate attributeName="width" values="0;0;537.088;537.088;0" keyTimes="0.0000;0.0000;0.1200;0.9300;1.0000" dur="9s" begin="0s" repeatCount="indefinite"/></rect><text x="986" y="120" font-size="15" font-weight="800" opacity="0">0.8392 ✓<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0000;0.1200;0.9300;1.0000" dur="9s" begin="0s" repeatCount="indefinite"/></text><text x="320" y="156" font-size="13" text-anchor="end" class="m">Agglomerative</text><rect x="330" y="138" width="640" height="24" rx="6" fill="#0c1a30"/><rect x="330" y="138" width="0" height="24" rx="6" fill="#a78bfa" ><animate attributeName="width" values="0;0;524.288;524.288;0" keyTimes="0.0000;0.0400;0.1600;0.9300;1.0000" dur="9s" begin="0s" repeatCount="indefinite"/></rect><text x="986" y="156" font-size="15" font-weight="800" opacity="0">0.8192<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0400;0.1600;0.9300;1.0000" dur="9s" begin="0s" repeatCount="indefinite"/></text><text x="36" y="220" font-size="17" font-weight="800">Davies-Bouldin Index</text><text x="36" y="242" font-size="13" class="m">lower is better</text><text x="320" y="218" font-size="13" text-anchor="end" class="m">K-Means</text><rect x="330" y="200" width="640" height="24" rx="6" fill="#0c1a30"/><rect x="330" y="200" width="0" height="24" rx="6" fill="#34f089" ><animate attributeName="width" values="0;0;511.63428571428574;511.63428571428574;0" keyTimes="0.0000;0.0800;0.2000;0.9300;1.0000" dur="9s" begin="0s" repeatCount="indefinite"/></rect><text x="986" y="218" font-size="15" font-weight="800" opacity="0">0.2798<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.0800;0.2000;0.9300;1.0000" dur="9s" begin="0s" repeatCount="indefinite"/></text><text x="320" y="254" font-size="13" text-anchor="end" class="m">Agglomerative</text><rect x="330" y="236" width="640" height="24" rx="6" fill="#0c1a30"/><rect x="330" y="236" width="0" height="24" rx="6" fill="#a78bfa" ><animate attributeName="width" values="0;0;487.1314285714286;487.1314285714286;0" keyTimes="0.0000;0.1200;0.2400;0.9300;1.0000" dur="9s" begin="0s" repeatCount="indefinite"/></rect><text x="986" y="254" font-size="15" font-weight="800" opacity="0">0.2664 ✓<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1200;0.2400;0.9300;1.0000" dur="9s" begin="0s" repeatCount="indefinite"/></text><text x="36" y="318" font-size="17" font-weight="800">Calinski-Harabasz Index</text><text x="36" y="340" font-size="13" class="m">higher is better</text><text x="320" y="316" font-size="13" text-anchor="end" class="m">K-Means</text><rect x="330" y="298" width="640" height="24" rx="6" fill="#0c1a30"/><rect x="330" y="298" width="0" height="24" rx="6" fill="#34f089" ><animate attributeName="width" values="0;0;563.1399563636363;563.1399563636363;0" keyTimes="0.0000;0.1600;0.2800;0.9300;1.0000" dur="9s" begin="0s" repeatCount="indefinite"/></rect><text x="986" y="316" font-size="15" font-weight="800" opacity="0">48,395 ✓<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.1600;0.2800;0.9300;1.0000" dur="9s" begin="0s" repeatCount="indefinite"/></text><text x="320" y="352" font-size="13" text-anchor="end" class="m">Agglomerative</text><rect x="330" y="334" width="640" height="24" rx="6" fill="#0c1a30"/><rect x="330" y="334" width="0" height="24" rx="6" fill="#a78bfa" ><animate attributeName="width" values="0;0;495.505570909091;495.505570909091;0" keyTimes="0.0000;0.2000;0.3200;0.9300;1.0000" dur="9s" begin="0s" repeatCount="indefinite"/></rect><text x="986" y="352" font-size="15" font-weight="800" opacity="0">42,583<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.0000;0.2000;0.3200;0.9300;1.0000" dur="9s" begin="0s" repeatCount="indefinite"/></text>
